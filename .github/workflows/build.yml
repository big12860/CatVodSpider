name: Build Spider Jar

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant gradlew
        run: chmod +x gradlew

      - name: Show SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME"; ls $ANDROID_HOME/platforms 2>/dev/null || true

      - name: Build spider jar
        run: ./gradlew generateSpiderJar --no-daemon --stacktrace

      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom_spider
          path: jar/custom_spider.jar
          if-no-files-found: error
