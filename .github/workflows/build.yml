name: Build Spider Jar

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Grant gradlew
        run: chmod +x gradlew
      - name: Build fat spider jar
        run: ./gradlew generateFatSpiderJar --no-daemon --stacktrace
      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spider_jars
          path: |
            jar/fat_spider.jar
            jar/custom_spider.jar
          if-no-files-found: warn
